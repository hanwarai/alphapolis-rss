name: github pages publish

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    env:
      PAGES_BASE_URL: https://hanwarai.github.io/alphapolis-rss
    steps:
      - uses: actions/checkout@v7

      # uv 本体のバージョンは pyproject.toml の [dependency-groups] ci にピンしてあり、
      # Dependabot (uv エコシステム) がそれを bump する。ここでその値を読み取り setup-uv に渡す。
      - name: Resolve uv version
        id: uv-version
        run: |
          version=$(grep -oP '"uv==\K[0-9]+\.[0-9]+\.[0-9]+' pyproject.toml)
          if [ -z "$version" ]; then
            echo "::error::could not resolve uv version pin from pyproject.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv
        # setup-uv は v8.0.0 以降、可動メジャータグ (@v8 等) の発行を停止した
        # (supply-chain 対策)。Dependabot が追える SHA ピン + バージョン
        # コメント形式で固定する。
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ steps.uv-version.outputs.version }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --all-extras

      - name: Install Playwright Chromium
        run: uv run playwright install --with-deps chromium

      - name: Seed feeds/ from previously deployed site
        run: |
          mkdir -p feeds
          curl -sfL -o feeds/index.html "$PAGES_BASE_URL/" || true
          while IFS=, read -r feed_id _; do
            if [[ "$feed_id" =~ ^[0-9]+$ ]]; then
              curl -sfL -o "feeds/${feed_id}.xml" "$PAGES_BASE_URL/${feed_id}.xml" || true
            fi
          done < feed.csv
          ls -la feeds/

      - name: main.py
        run: uv run main.py

      - name: Deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: feeds

  publish:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
